<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kikimecha — links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d0a;
    --green:#39ff88;
    --green-dim:#1c8a4e;
    --green-faint:#0f3d24;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--green);
    font-family:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    overflow-x:hidden;
    min-height:100vh;
  }
  a{ color:inherit; }

  .glyphs{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .glyph{
    position:absolute; color:var(--green-faint); font-size:1.4rem; user-select:none;
  }

  nav{
    position:relative; z-index:2;
    display:flex; justify-content:space-between; align-items:center;
    padding:24px 32px;
    border-bottom:1px solid var(--green-faint);
    font-size:0.85rem;
  }
  nav .brand{ color:var(--green); font-weight:700; letter-spacing:0.02em; text-decoration:none; }
  nav .links{ display:flex; gap:24px; }
  nav .links a{ text-decoration:none; color:var(--green-dim); transition:color 0.15s ease; }
  nav .links a:hover{ color:var(--green); }

  main{
    position:relative; z-index:2;
    max-width:560px; margin:0 auto;
    padding:64px 32px 80px;
  }
  .prompt-line{
    color:var(--green-dim); font-size:0.95rem; margin-bottom:10px;
  }
  .prompt-line .cursor{
    display:inline-block; width:9px; height:1.1em; background:var(--green);
    margin-left:4px; vertical-align:text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  h1{
    font-size:clamp(2rem, 7vw, 2.8rem);
    margin:0 0 40px; font-weight:700; letter-spacing:-0.01em;
    text-shadow: 0 0 18px rgba(57,255,136,0.3);
  }
  h1 .brk{ color:var(--green-dim); }

  .link-list{
    display:flex; flex-direction:column; gap:12px;
  }
  .link-row{
    display:flex; align-items:center; gap:14px;
    padding:16px 18px;
    border:1px solid var(--green-faint);
    text-decoration:none;
    color:var(--green);
    font-size:1rem;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .link-row .idx{ color:var(--green-dim); font-size:0.9rem; }
  .link-row .label{ flex:1; }
  .link-row .arrow{ color:var(--green-dim); }
  .link-row:hover{
    background:var(--green);
    color:var(--bg);
    border-color:var(--green);
  }
  .link-row:hover .idx,
  .link-row:hover .arrow{ color:var(--bg); }

  footer{
    position:relative; z-index:2; padding:0 32px 60px;
    max-width:560px; margin:0 auto;
    font-size:0.8rem; color:var(--green-dim);
  }

  :focus-visible{ outline:2px solid var(--green); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    .cursor{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

  <div class="glyphs" id="glyphField" aria-hidden="true"></div>

  <nav>
    <a href="index.html" class="brand">kikimecha</a>
    <div class="links">
      <a href="/#about">about</a>
      <a href="/#contact">contact</a>
    </div>
  </nav>

  <main>
    <div class="prompt-line">~/kikimecha $ ls ./links<span class="cursor"></span></div>
    <h1>links<span class="brk">_</span></h1>

    <div class="link-list">
      <a class="link-row" href="https://instagram.com/kikimecha">
        <span class="idx">[01]</span>
        <span class="label">instagram</span>
        <span class="arrow">-&gt;</span>
      </a>
      <a class="link-row" href="https://kikimecha.bandcamp.com">
        <span class="idx">[02]</span>
        <span class="label">bandcamp</span>
        <span class="arrow">-&gt;</span>
      </a>
      <a class="link-row" href="https://soundcloud.com/kikimecha">
        <span class="idx">[03]</span>
        <span class="label">soundcloud</span>
        <span class="arrow">-&gt;</span>
      </a>
      <a class="link-row" href="https://youtube.com/@kikimecha">
        <span class="idx">[04]</span>
        <span class="label">youtube</span>
        <span class="arrow">-&gt;</span>
      </a>
      <a class="link-row" href="https://tiktok.com/@kikimecha">
        <span class="idx">[05]</span>
        <span class="label">tiktok</span>
        <span class="arrow">-&gt;</span>
      </a>
      <a class="link-row" href="https://bsky.app/profile/kikimecha.com">
        <span class="idx">[06]</span>
        <span class="label">bluesky</span>
        <span class="arrow">-&gt;</span>
      </a>
    </div>
  </main>

  <footer>kikimecha</footer>

<script>
  const chars = ['[',']','(',')','{','}','./','\\\\','[]','()','{}','/>','<-'];
  const field = document.getElementById('glyphField');
  const count = window.innerWidth < 700 ? 16 : 30;
  for (let i = 0; i < count; i++) {
    const g = document.createElement('div');
    g.className = 'glyph';
    g.textContent = chars[Math.floor(Math.random() * chars.length)];
    g.style.left = Math.random() * 100 + 'vw';
    g.style.top = Math.random() * 100 + 'vh';
    g.style.fontSize = (0.9 + Math.random() * 1.4) + 'rem';
    g.style.opacity = (0.25 + Math.random() * 0.5).toFixed(2);
    field.appendChild(g);
  }
</script>

</body>
</html>
