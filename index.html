
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">

<title>kikimecha — Coming Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    text-align: center;
    padding: 30px;
}

h1 {
    font-size: clamp(36px, 7vw, 76px);
    font-weight: 500;
    letter-spacing: -0.065em;
    text-transform: uppercase;
    margin-bottom: 38px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 155px;
    padding: 14px 25px;
    border: 1px solid #fff;
    background: transparent;
    color: #fff;
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    transition: background .25s ease, color .25s ease;
}

.button:hover {
    background: #fff;
    color: #000;
}

.button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 5px;
}

@media (max-width: 400px) {
    .buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<main class="container">
    <h1>Coming Soon.</h1>

    <nav class="buttons">
        <a class="button" href="https://kikimecha.com/livecontrol">
            LiveControl
        </a>

        <a class="button"
           href="https://github.com/35socks"
           target="_blank"
           rel="noopener noreferrer">
            GitHub
        </a>
    </nav>
</main>

</body>
</html>
